name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 scripts/audit-secrets.py --history
      - run: npm run format:check
      - run: npm test
      - run: npm run build:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run windows:build
      - run: npm run windows:smoke -- "artifacts/windows/win-unpacked/AI Lover.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-lover-windows
          path: |
            artifacts/windows/*Setup.exe
            artifacts/windows/*.zip
          if-no-files-found: error
          retention-days: 30
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run android:sync
      - name: Restore test APK signing identity when available
        env:
          ANDROID_TEST_KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE }}
          ANDROID_TEST_KEYSTORE_PATH: ${{ runner.temp }}/ai-lover-signing/debug.keystore
        run: |
          if [ -n "$ANDROID_TEST_KEYSTORE" ]; then
            mkdir -p "$(dirname "$ANDROID_TEST_KEYSTORE_PATH")"
            chmod 700 "$(dirname "$ANDROID_TEST_KEYSTORE_PATH")"
            printf '%s' "$ANDROID_TEST_KEYSTORE" | base64 --decode > "$ANDROID_TEST_KEYSTORE_PATH"
            chmod 600 "$ANDROID_TEST_KEYSTORE_PATH"
          fi
      - run: cd apps/android && ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Apply and verify established APK signing identity when available
        env:
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
          ANDROID_TEST_KEYSTORE_PATH: ${{ runner.temp }}/ai-lover-signing/debug.keystore
          ANDROID_TEST_CERTIFICATE_SHA256: ${{ vars.ANDROID_TEST_CERTIFICATE_SHA256 }}
        run: |
          if [ -f "$ANDROID_TEST_KEYSTORE_PATH" ]; then
            node scripts/sign-android-test.mjs apps/android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Test signing secret is unavailable; keeping this CI-only APK's generated signature."
          fi
      - run: python3 scripts/audit-secrets.py apps/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ai-lover-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
