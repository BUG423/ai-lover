<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-labelledby="title desc">
  <title id="title">知心 · AI Lover</title>
  <desc id="desc">一处属于你的温柔角落。电脑与手机，随时靠近一点。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef3e6"/><stop offset=".6" stop-color="#f7f7f0"/><stop offset="1" stop-color="#f3e8e1"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#92ad88"/><stop offset="1" stop-color="#507660"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
  </defs>
  <rect width="1200" height="336" rx="28" fill="url(#bg)"/>
  <circle cx="84" cy="74" r="135" fill="#d9e7d1" opacity=".28"/>
  <circle cx="1154" cy="294" r="165" fill="#ebd8cc" opacity=".28"/>
  <rect x="22" y="22" width="1156" height="292" rx="23" fill="url(#glass)" stroke="#fff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="600" y="72" text-anchor="middle" font-size="12" letter-spacing="5" fill="#6d8168">YOUR LITTLE SPACE OF CONNECTION</text>
    <rect x="426" y="105" width="65" height="65" rx="20" fill="url(#mark)"/>
    <path d="M458 152c-9-7-22-16-22-27 0-12 15-16 22-5 7-11 22-7 22 5 0 11-13 20-22 27Z" fill="#fffaf1"/>
    <text x="511" y="155" font-size="49" font-weight="600" fill="#365543">知心<tspan fill="#78956e">.</tspan></text>
    <text x="650" y="151" font-size="25" font-weight="400" fill="#5c755d">AI Lover</text>
    <text x="600" y="211" text-anchor="middle" font-size="24" fill="#425f49">有些话，想说给懂你的人听。</text>
    <g font-size="13" fill="#607759">
      <rect x="408" y="246" width="118" height="30" rx="15" fill="#e7eee1"/><text x="467" y="266" text-anchor="middle">电脑与手机</text>
      <rect x="542" y="246" width="116" height="30" rx="15" fill="#e7eee1"/><text x="600" y="266" text-anchor="middle">磨砂玻璃</text>
      <rect x="674" y="246" width="118" height="30" rx="15" fill="#e7eee1"/><text x="733" y="266" text-anchor="middle">独立 AI 陪伴</text>
    </g>
  </g>
</svg>
